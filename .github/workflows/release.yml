            arch: x64
          - name: windows-arm64
            runner: windows-11-vs2026-arm
            platform: win
            arch: arm64
          - name: ubuntu-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - name: ubuntu-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - name: macos-intel-x64
            runner: macos-15-intel
            platform: mac
            arch: x64
          - name: macos-apple-silicon-arm64
            runner: macos-latest
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.runner }}
