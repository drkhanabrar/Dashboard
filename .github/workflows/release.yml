  android:
    name: Android APK (phone, tablet and Android TV)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Generate native Android project
        run: |
          npm run mobile:prepare
          npx cap add android
          npx cap sync android
          node apps/mobile/scripts/patch-android.cjs
      - name: Build installable debug-signed APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Stage Android APK
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/MirrorForge-${GITHUB_REF_NAME#v}-android-debug-signed.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14

